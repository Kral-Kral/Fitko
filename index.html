<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Workout Log</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 800px; margin: 0 auto; }
        header { text-align: center; padding: 12px 0 20px 0; border-bottom: 1px solid var(--border-color); margin-bottom: 20px; }
        h1 { font-size: 1.6rem; color: var(--accent); }
        
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
        .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        
        .btn { background-color: var(--accent); color: #0f172a; font-weight: 600; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 0.95rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn:hover { background-color: var(--accent-hover); color: #fff; }
        .btn-secondary { background-color: #334155; color: #fff; }
        .btn-success { background-color: #15803d; color: #fff; }
        .btn-success:hover { background-color: var(--success); }
        .btn-danger { background-color: #451a1a; color: var(--danger); border: 1px solid var(--danger); }
        .btn-danger:hover { background-color: var(--danger); color: white; }
        .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
        .timer-badge { font-family: monospace; font-size: 1rem; background: #0f172a; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--border-color); color: var(--accent); }

        .status-box { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 12px; text-align: center; }
        .status-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; display: block; }
        .status-value { font-family: monospace; font-size: 1.1rem; font-weight: bold; }

        select, input { width: 100%; padding: 10px; background-color: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 0.95rem; margin-bottom: 12px; }
        select:focus, input:focus { outline: none; border-color: var(--accent); }

        .exercise-block { background: #0f172a; border: 1px solid var(--border-color); border-radius: 8px; padding: 12px; margin-bottom: 16px; }
        .exercise-header { font-weight: 600; margin-bottom: 10px; color: var(--accent); display: flex; justify-content: space-between; }

        .sets-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .sets-table th, .sets-table td { text-align: left; padding: 6px 8px; font-size: 0.85rem; }
        .sets-table th { color: var(--text-muted); border-bottom: 1px solid var(--border-color); }
        .sets-table input { margin-bottom: 0; padding: 6px; text-align: center; }

        .add-exercise-bar { display: flex; gap: 8px; margin-bottom: 8px; }
        .add-exercise-bar select { margin-bottom: 0; flex: 1; }

        .actions-bar { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 16px; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto; }
        .modal-list-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-color); gap: 8px; }
    </style>
</head>
<body>

    <header>
        <h1>TRÉNINKOVÝ DENÍK</h1>
    </header>

    <div class="card">
        <div class="card-title">
            <span id="panel-title">Zahájit trénink</span>
            <span id="timer" class="timer-badge" style="display:none;">00:00:00</span>
        </div>

        <div id="workout-setup">
            <label style="display:block; margin-bottom: 6px; font-size:0.85rem; color: var(--text-muted);">Vyberte typ tréninku:</label>
            <select id="workout-type">
                <option value="UPPER">UPPER</option>
                <option value="LOWER">LOWER</option>
                <option value="FULL BODY">FULL BODY</option>
                <option value="PUSH">PUSH</option>
                <option value="PULL">PULL</option>
                <option value="LEGS">LEGS</option>
            </select>
            <button class="btn" style="width: 100%;" onclick="startWorkout()">🚀 Start Trénink</button>
        </div>

        <div id="workout-active" style="display: none;">
            
            <div class="status-box">
                <div>
                    <span class="status-label">Aktuální pauza</span>
                    <span id="current-rest-display" class="status-value" style="color: var(--warning);">00:00</span>
                </div>
                <div>
                    <span class="status-label">Čistý čas</span>
                    <span id="net-time-display" class="status-value" style="color: var(--accent);">00:00:00</span>
                </div>
                <div>
                    <span class="status-label">Součet pauz</span>
                    <span id="total-rest-display" class="status-value" style="color: var(--text-muted);">00:00:00</span>
                </div>
            </div>

            <div class="add-exercise-bar">
                <select id="exercise-select">
                    <option value="">-- Vybrat cvik ze zásobníku --</option>
                </select>
                <button class="btn" onclick="addSelectedExercise()">+ Přidat</button>
            </div>
            
            <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                <button class="btn btn-success btn-sm" style="flex: 1;" onclick="openAddModal()">➕ Přidat nový cvik do databáze</button>
                <button class="btn btn-secondary btn-sm" style="flex: 1;" onclick="openManagerModal()">⚙️ Upravit seznam</button>
            </div>

            <div id="exercises-container"></div>

            <div class="actions-bar">
                <button class="btn btn-secondary" onclick="cancelWorkout()">← Zpět do menu</button>
                <button class="btn btn-danger" style="flex: 1;" onclick="finishWorkout()">🏁 Ukončit & Odeslat do Google Tabulek</button>
            </div>
        </div>
    </div>

    <!-- MODAL: RYCHLÉ PŘIDÁNÍ CVIKU -->
    <div id="add-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; color: var(--accent);">Přidat nový cvik</h3>
            <label style="font-size:0.8rem; color:var(--text-muted); display:block; margin-bottom:4px;">Vyberte partii:</label>
            <select id="quick-add-category">
                <option value="Prsa">Prsa</option>
                <option value="Záda">Záda</option>
                <option value="Ramena">Ramena</option>
                <option value="Biceps">Biceps</option>
                <option value="Triceps">Triceps</option>
                <option value="Kvadry">Kvadry</option>
                <option value="Hamstringy">Hamstringy</option>
                <option value="Zadek">Zadek</option>
                <option value="Lýtka">Lýtka</option>
                <option value="Břicho">Břicho</option>
            </select>
            <input type="text" id="quick-add-input" placeholder="Název cviku...">
            <div style="display:flex; gap:8px;">
                <button class="btn btn-secondary" style="flex:1;" onclick="closeAddModal()">Zrušit</button>
                <button class="btn btn-success" style="flex:1;" onclick="quickAddNewExercise()">Uložit cvik</button>
            </div>
        </div>
    </div>

    <!-- MODAL: SPRÁVA A ÚPRAVA EXISTUJÍCÍCH CVIKŮ -->
    <div id="manager-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 style="margin-bottom:12px; color: var(--accent);">Správa a úprava cviků</h3>
            <div id="exercise-manager-list"></div>
            <button class="btn btn-secondary" style="width:100%; margin-top:16px;" onclick="closeManagerModal()">Zavřít</button>
        </div>
    </div>

    <script>
        // PROPOJENÍ S GOOGLE APPS SCRIPT
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUtDIViOtXMExmqOumdP0RkH7AOZ0UhfTW77N2g7xcVRQKbhiekgbVAyWZQ-Ex2eTwkA/exec";

        const WORKOUT_PARTIES_MAP = {
            "UPPER": ["Prsa", "Záda", "Ramena", "Biceps", "Triceps"],
            "LOWER": ["Kvadry", "Hamstringy", "Zadek", "Lýtka", "Břicho"],
            "FULL BODY": ["Prsa", "Záda", "Ramena", "Biceps", "Triceps", "Kvadry", "Hamstringy", "Zadek", "Lýtka", "Břicho"],
            "PUSH": ["Prsa", "Ramena", "Triceps"],
            "PULL": ["Záda", "Biceps"],
            "LEGS": ["Kvadry", "Hamstringy", "Zadek", "Lýtka"]
        };

        const DEFAULT_EXERCISES_DATABASE = {
            "Prsa": ["Bench Press", "Incline Dumbbell Press", "Chest Flyes", "Incline Smith Machine Press", "Dips"],
            "Záda": ["Lat Pulldown", "Barbell Row", "Cable Row", "Pull-Ups", "T-Bar Row"],
            "Ramena": ["Overhead Press", "Lateral Raise", "Face Pull", "Dumbbell Shoulder Press", "Reverse Flyes"],
            "Biceps": ["Barbell Biceps Curl", "Hammer Curl", "Preacher Curl", "Incline Dumbbell Curl"],
            "Triceps": ["Triceps Pushdown", "French Press", "Skullcrusher", "Overhead Cable Extension"],
            "Kvadry": ["Barbell Squat", "Leg Press", "Leg Extension", "Hack Squat"],
            "Hamstringy": ["Romanian Deadlift", "Lying Leg Curl", "Seated Leg Curl"],
            "Zadek": ["Hip Thrust", "Glute Cable Kickback"],
            "Lýtka": ["Standing Calf Raise", "Seated Calf Raise"],
            "Břicho": ["Abdominal Crunch", "Hanging Leg Raise", "Plank"]
        };

        let exerciseDatabase = {};
        let currentWorkout = null;
        let mainInterval = null;

        window.onload = function() {
            loadExerciseDatabase();
        };

        function loadExerciseDatabase() {
            const saved = localStorage.getItem("gym_exercise_db_v2");
            if (saved) {
                try { exerciseDatabase = JSON.parse(saved); } catch(e) { exerciseDatabase = JSON.parse(JSON.stringify(DEFAULT_EXERCISES_DATABASE)); }
            } else {
                exerciseDatabase = JSON.parse(JSON.stringify(DEFAULT_EXERCISES_DATABASE));
            }
        }

        function saveExerciseDatabase() {
            localStorage.setItem("gym_exercise_db_v2", JSON.stringify(exerciseDatabase));
            populateDropdown();
        }

        function populateDropdown() {
            if (!currentWorkout) return;

            const select = document.getElementById("exercise-select");
            select.innerHTML = '<option value="">-- Vybrat cvik ze zásobníku --</option>';

            const relevantParties = WORKOUT_PARTIES_MAP[currentWorkout.type] || [];

            relevantParties.forEach(partia => {
                const exercises = exerciseDatabase[partia] || [];
                if (exercises.length > 0) {
                    const optgroup = document.createElement("optgroup");
                    optgroup.label = `--- ${partia.toUpperCase()} ---`;

                    exercises.forEach(ex => {
                        const opt = document.createElement("option");
                        opt.value = ex;
                        opt.textContent = ex;
                        optgroup.appendChild(opt);
                    });
                    select.appendChild(optgroup);
                }
            });
        }

        function openAddModal() {
            document.getElementById("quick-add-input").value = "";
            document.getElementById("add-modal").style.display = "flex";
        }

        function closeAddModal() {
            document.getElementById("add-modal").style.display = "none";
        }

        function quickAddNewExercise() {
            const category = document.getElementById("quick-add-category").value;
            const input = document.getElementById("quick-add-input");
            const val = input.value.trim();

            if (val) {
                if (!exerciseDatabase[category]) exerciseDatabase[category] = [];
                if (!exerciseDatabase[category].includes(val)) {
                    exerciseDatabase[category].push(val);
                    saveExerciseDatabase();
                    
                    if (currentWorkout) {
                        currentWorkout.exercises.push({
                            name: val,
                            sets: [{ weight: "", reps: "" }]
                        });
                        renderWorkoutExercises();
                    }
                }
                closeAddModal();
            }
        }

        function openManagerModal() {
            renderManagerList();
            document.getElementById("manager-modal").style.display = "flex";
        }

        function closeManagerModal() {
            document.getElementById("manager-modal").style.display = "none";
        }

        function renderManagerList() {
            const container = document.getElementById("exercise-manager-list");
            container.innerHTML = "";

            Object.keys(exerciseDatabase).forEach(partia => {
                const partiaTitle = document.createElement("h4");
                partiaTitle.style.cssText = "color: var(--accent); margin-top: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--border-color);";
                partiaTitle.innerText = partia;
                container.appendChild(partiaTitle);

                exerciseDatabase[partia].forEach((ex, idx) => {
                    const item = document.createElement("div");
                    item.className = "modal-list-item";
                    item.innerHTML = `
                        <input type="text" value="${ex}" onchange="updateExerciseName('${partia}', ${idx}, this.value)" style="margin-bottom:0; padding:4px 8px;">
                        <button class="btn btn-sm btn-danger" onclick="deleteExerciseFromDb('${partia}', ${idx})">Smazat</button>
                    `;
                    container.appendChild(item);
                });
            });
        }

        function updateExerciseName(partia, idx, newName) {
            if (newName.trim() !== "") {
                exerciseDatabase[partia][idx] = newName.trim();
                saveExerciseDatabase();
            }
        }

        function deleteExerciseFromDb(partia, idx) {
            exerciseDatabase[partia].splice(idx, 1);
            saveExerciseDatabase();
            renderManagerList();
        }

        function startWorkout() {
            const type = document.getElementById("workout-type").value;
            const now = Date.now();
            currentWorkout = {
                id: now,
                type: type,
                startTime: new Date(now).toISOString(),
                lastSetTimestamp: now,
                totalRestSeconds: 0,
                exercises: []
            };
            uiStartWorkout();
        }

        function uiStartWorkout() {
            document.getElementById("workout-setup").style.display = "none";
            document.getElementById("workout-active").style.display = "block";
            document.getElementById("timer").style.display = "inline-block";
            document.getElementById("panel-title").innerText = "Aktivní: " + currentWorkout.type;
            
            populateDropdown();
            renderWorkoutExercises();
            startEngine();
        }

        function cancelWorkout() {
            if (confirm("Chceš se vrátit do menu? Probíhající trénink bude zrušen.")) {
                clearInterval(mainInterval);
                currentWorkout = null;
                document.getElementById("workout-active").style.display = "none";
                document.getElementById("workout-setup").style.display = "block";
                document.getElementById("timer").style.display = "none";
                document.getElementById("panel-title").innerText = "Zahájit trénink";
            }
        }

        function triggerSetCompletion() {
            if (!currentWorkout) return;
            const now = Date.now();
            const restDuration = Math.floor((now - currentWorkout.lastSetTimestamp) / 1000);
            if (restDuration > 0) {
                currentWorkout.totalRestSeconds = (currentWorkout.totalRestSeconds || 0) + restDuration;
            }
            currentWorkout.lastSetTimestamp = now;
        }

        function startEngine() {
            clearInterval(mainInterval);
            mainInterval = setInterval(() => {
                if (!currentWorkout) return;
                const now = Date.now();
                const start = new Date(currentWorkout.startTime).getTime();
                const totalSec = Math.floor((now - start) / 1000);
                const currentRestSec = Math.floor((now - currentWorkout.lastSetTimestamp) / 1000);
                const accumulatedRestSec = (currentWorkout.totalRestSeconds || 0) + currentRestSec;
                const netSec = Math.max(0, totalSec - accumulatedRestSec);

                document.getElementById("timer").innerText = formatSeconds(totalSec);
                document.getElementById("current-rest-display").innerText = formatMMSS(currentRestSec);
                document.getElementById("net-time-display").innerText = formatSeconds(netSec);
                document.getElementById("total-rest-display").innerText = formatSeconds(accumulatedRestSec);
            }, 1000);
        }

        function formatMMSS(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function formatSeconds(totalSec) {
            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function addSelectedExercise() {
            const select = document.getElementById("exercise-select");
            const val = select.value;
            if (!val) return;
            currentWorkout.exercises.push({
                name: val,
                sets: [{ weight: "", reps: "" }]
            });
            select.value = "";
            renderWorkoutExercises();
        }

        function renderWorkoutExercises() {
            const container = document.getElementById("exercises-container");
            container.innerHTML = "";

            currentWorkout.exercises.forEach((ex, exIdx) => {
                const exBlock = document.createElement("div");
                exBlock.className = "exercise-block";
                
                let setsHtml = "";
                ex.sets.forEach((set, setIdx) => {
                    setsHtml += `
                        <tr>
                            <td><strong>${setIdx + 1}. série</strong></td>
                            <td><input type="number" value="${set.weight}" placeholder="kg" onchange="updateSet(${exIdx}, ${setIdx}, 'weight', this.value)"></td>
                            <td><input type="number" value="${set.reps}" placeholder="opak" onchange="updateSet(${exIdx}, ${setIdx}, 'reps', this.value)"></td>
                            <td><button class="btn btn-sm btn-danger" onclick="removeSet(${exIdx}, ${setIdx})">✕</button></td>
                        </tr>
                    `;
                });

                exBlock.innerHTML = `
                    <div class="exercise-header">
                        <span>${ex.name}</span>
                        <button class="btn btn-sm btn-danger" onclick="removeExercise(${exIdx})">Smazat</button>
                    </div>
                    <table class="sets-table">
                        <thead>
                            <tr>
                                <th style="width:25%;">Série</th>
                                <th style="width:35%;">Váha (kg)</th>
                                <th style="width:30%;">Opakování</th>
                                <th style="width:10%;"></th>
                            </tr>
                        </thead>
                        <tbody>${setsHtml}</tbody>
                    </table>
                    <button class="btn btn-sm" style="margin-top: 8px;" onclick="addSet(${exIdx})">+ Přidat sérii</button>
                `;
                container.appendChild(exBlock);
            });
        }

        function updateSet(exIdx, setIdx, field, value) {
            currentWorkout.exercises[exIdx].sets[setIdx][field] = value;
            triggerSetCompletion();
        }

        function addSet(exIdx) {
            triggerSetCompletion();
            const lastSet = currentWorkout.exercises[exIdx].sets.slice(-1)[0];
            currentWorkout.exercises[exIdx].sets.push({ 
                weight: lastSet ? lastSet.weight : "", 
                reps: lastSet ? lastSet.reps : "" 
            });
            renderWorkoutExercises();
        }

        function removeSet(exIdx, setIdx) {
            currentWorkout.exercises[exIdx].sets.splice(setIdx, 1);
            renderWorkoutExercises();
        }

        function removeExercise(exIdx) {
            currentWorkout.exercises.splice(exIdx, 1);
            renderWorkoutExercises();
        }

        async function finishWorkout() {
            if (!confirm("Ukončit trénink a odeslat do Google Tabulek?")) return;

            triggerSetCompletion();
            clearInterval(mainInterval);
            
            const now = new Date();
            const start = new Date(currentWorkout.startTime);
            const totalSec = Math.floor((now - start) / 1000);
            const restSec = currentWorkout.totalRestSeconds || 0;
            const netSec = Math.max(0, totalSec - restSec);

            const dataToSend = [];

            currentWorkout.exercises.forEach(ex => {
                ex.sets.forEach((set, i) => {
                    if (set.weight !== "" || set.reps !== "") {
                        dataToSend.push({
                            datum: start.toLocaleDateString("cs-CZ"),
                            casZacatku: start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            casKonce: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                            typTreninku: currentWorkout.type,
                            cvik: ex.name,
                            serie: i + 1,
                            vaha: Number(set.weight) || 0,
                            opakovani: Number(set.reps) || 0,
                            celkovyCas: formatSeconds(totalSec),
                            cistyCas: formatSeconds(netSec),
                            celkovyCasPauz: formatSeconds(restSec)
                        });
                    }
                });
            });

            if (dataToSend.length === 0) {
                dataToSend.push({
                    datum: start.toLocaleDateString("cs-CZ"),
                    casZacatku: start.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    casKonce: now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                    typTreninku: currentWorkout.type,
                    cvik: "Bez zapsaných sérií",
                    serie: 0,
                    vaha: 0,
                    opakovani: 0,
                    celkovyCas: formatSeconds(totalSec),
                    cistyCas: formatSeconds(netSec),
                    celkovyCasPauz: formatSeconds(restSec)
                });
            }

            try {
                // Změněno Content-Type a mode pro správný obchvat CORS u Google Apps Scriptu
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ rows: dataToSend })
                });

                alert("Trénink byl úspěšně odeslán do Google Tabulek!");
            } catch (err) {
                alert("Chyba při odesílání do Google Tabulek: " + err);
            }

            currentWorkout = null;
            document.getElementById("workout-active").style.display = "none";
            document.getElementById("workout-setup").style.display = "block";
            document.getElementById("timer").style.display = "none";
            document.getElementById("panel-title").innerText = "Zahájit trénink";
        }
    </script>
</body>
</html>
