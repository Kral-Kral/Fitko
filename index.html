<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitko Log App - Smart Pause</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger: #ef4444;
            --warning: #f59e0b;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 800px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 12px 0 20px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn {
            background-color: var(--accent);
            color: #0f172a;
            font-weight: 600;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            color: #ffffff;
        }

        .btn-danger {
            background-color: #451a1a;
            color: var(--danger);
            border: 1px solid var(--danger);
        }

        .btn-danger:hover {
            background-color: var(--danger);
            color: white;
        }

        .btn-sm {
            padding: 6px 10px;
            font-size: 0.8rem;
        }

        .timer-badge {
            font-family: monospace;
            font-size: 1rem;
            background: #0f172a;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            color: var(--accent);
        }

        .status-box {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            text-align: center;
        }

        .status-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .status-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .status-value {
            font-family: monospace;
            font-size: 1.1rem;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .exercise-block {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .exercise-header {
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }

        .sets-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
        }

        .sets-table th, .sets-table td {
            text-align: left;
            padding: 6px 8px;
            font-size: 0.85rem;
        }

        .sets-table th {
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .sets-table input {
            margin-bottom: 0;
            padding: 6px;
            text-align: center;
        }

        .history-table-wrapper {
            overflow-x: auto;
        }

        table.history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 650px;
        }

        table.history-table th, table.history-table td {
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            text-align: left;
            vertical-align: top;
        }

        table.history-table th {
            background-color: #0f172a;
            color: var(--accent);
        }

        .set-chip {
            background: #1e293b;
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 4px;
            margin: 2px 0;
            display: inline-block;
            font-family: monospace;
        }

        .actions-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <header>
        <h1>GYM WORKOUT LOG</h1>
        <div class="subtitle">Detekce pauz podle zapsaných sérií</div>
    </header>

    <div class="card" id="workout-card">
        <div class="card-title">
            <span>Aktivní Trénink</span>
            <span id="timer" class="timer-badge">00:00:00</span>
        </div>

        <div id="workout-setup">
            <label for="workout-type" style="display:block; margin-bottom: 6px; font-size:0.85rem; color: var(--text-muted);">Zvolte typ tréninku:</label>
            <select id="workout-type">
                <option value="Upper">UPPER (Horní tělo)</option>
                <option value="Lower">LOWER (Spodní tělo)</option>
                <option value="Full Body">FULL BODY (Celé tělo)</option>
            </select>
            <button class="btn" style="width: 100%;" onclick="startWorkout()">🚀 Zahájit trénink</button>
        </div>

        <div id="workout-active" style="display: none;">
            
            <div class="status-box">
                <div class="status-item">
                    <span class="status-label">Aktuální Pauza</span>
                    <span id="current-rest-display" class="status-value" style="color: var(--warning);">00:00</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Čistý čas cvičení</span>
                    <span id="net-time-display" class="status-value" style="color: var(--accent);">00:00:00</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Součet pauz</span>
                    <span id="total-rest-display" class="status-value" style="color: var(--text-muted);">00:00:00</span>
                </div>
            </div>

            <div id="exercises-container"></div>

            <div class="actions-bar">
                <button class="btn" style="flex: 1;" onclick="addExercisePrompt()">+ Přidat cvik</button>
                <button class="btn btn-danger" onclick="finishWorkout()">🏁 Ukončit trénink</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">
            <span>Přehled Uložených Tréninků</span>
            <button class="btn btn-sm" onclick="exportData()">💾 Export JSON</button>
        </div>

        <div class="history-table-wrapper">
            <table class="history-table">
                <thead>
                    <tr>
                        <th>Začátek & Konec</th>
                        <th>Rozpad času</th>
                        <th>Trénink</th>
                        <th>Cviky, Série a Váhy</th>
                        <th>Akce</th>
                    </tr>
                </thead>
                <tbody id="history-tbody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const EXERCISE_DATABASE = {
            "Upper": ["Tlaky s jednoručkami na šikmé lavici", "Přítahy v předklonu na multipressu", "Peck Deck", "Stahování kladky na široko", "Tlaky na ramena na stroji"],
            "Lower": ["Dřep s opaskem (Belt Squat)", "Hip Thrust", "Předkopávání", "Zakopávání v leže nebo v sedě"],
            "Full Body": ["Dřep s opaskem", "Tlaky s jednoručkami na šikmé lavici", "High Row na stroji", "Tlaky na ramena na stroji"]
        };

        let currentWorkout = null;
        let mainInterval = null;

        window.onload = function() {
            renderHistory();
            checkActiveWorkout();
        };

        function startWorkout() {
            const type = document.getElementById("workout-type").value;
            const now = Date.now();
            
            currentWorkout = {
                id: now,
                type: type,
                startTime: new Date(now).toISOString(),
                lastSetTimestamp: now, // Pauza začíná běžet od startu tréninku
                totalRestSeconds: 0,
                exercises: []
            };

            const defaultExercises = EXERCISE_DATABASE[type] || [];
            defaultExercises.forEach(exName => {
                currentWorkout.exercises.push({
                    name: exName,
                    sets: [{ weight: "", reps: "" }]
                });
            });

            saveActiveWorkoutState();
            uiStartWorkout();
        }

        function uiStartWorkout() {
            document.getElementById("workout-setup").style.display = "none";
            document.getElementById("workout-active").style.display = "block";

            renderWorkoutExercises();
            startEngine();
        }

        function triggerSetCompletion() {
            if (!currentWorkout) return;
            const now = Date.now();
            
            // Doba od poslední zapsané série se připočte do celkových pauz
            const restDuration = Math.floor((now - currentWorkout.lastSetTimestamp) / 1000);
            if (restDuration > 0) {
                currentWorkout.totalRestSeconds = (currentWorkout.totalRestSeconds || 0) + restDuration;
            }
            
            // Reset časovače pro novou pauzu
            currentWorkout.lastSetTimestamp = now;
            saveActiveWorkoutState();
        }

        function startEngine() {
            clearInterval(mainInterval);
            mainInterval = setInterval(() => {
                if (!currentWorkout) return;

                const now = Date.now();
                const start = new Date(currentWorkout.startTime).getTime();
                const totalSec = Math.floor((now - start) / 1000);
                
                // Aktuální běžící pauza od poslední série
                const currentRestSec = Math.floor((now - currentWorkout.lastSetTimestamp) / 1000);
                
                // Celková suma pauz (uložené + probíhající)
                const accumulatedRestSec = (currentWorkout.totalRestSeconds || 0) + currentRestSec;
                
                // Čistý čas cvičení
                const netSec = Math.max(0, totalSec - accumulatedRestSec);

                document.getElementById("timer").innerText = formatSeconds(totalSec);
                document.getElementById("current-rest-display").innerText = formatMMSS(currentRestSec);
                document.getElementById("net-time-display").innerText = formatSeconds(netSec);
                document.getElementById("total-rest-display").innerText = formatSeconds(accumulatedRestSec);

            }, 1000);
        }

        function formatMMSS(sec) {
            const m = String(Math.floor(sec / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${m}:${s}`;
        }

        function formatSeconds(totalSec) {
            const hrs = String(Math.floor(totalSec / 3600)).padStart(2, '0');
            const mins = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
            const secs = String(totalSec % 60).padStart(2, '0');
            return `${hrs}:${mins}:${secs}`;
        }

        function formatDurationText(totalSec) {
            const mins = Math.floor(totalSec / 60);
            const hrs = Math.floor(mins / 60);
            const remMins = mins % 60;
            return hrs > 0 ? `${hrs}h ${remMins}m` : `${remMins} min`;
        }

        function renderWorkoutExercises() {
            const container = document.getElementById("exercises-container");
            container.innerHTML = "";

            currentWorkout.exercises.forEach((ex, exIdx) => {
                const exBlock = document.createElement("div");
                exBlock.className = "exercise-block";
                
                let setsHtml = "";
                ex.sets.forEach((set, setIdx) => {
                    setsHtml += `
                        <tr>
                            <td><strong>${setIdx + 1}. série</strong></td>
                            <td><input type="number" value="${set.weight}" placeholder="kg" onchange="updateSet(${exIdx}, ${setIdx}, 'weight', this.value)"></td>
                            <td><input type="number" value="${set.reps}" placeholder="opak" onchange="updateSet(${exIdx}, ${setIdx}, 'reps', this.value)"></td>
                            <td><button class="btn btn-sm btn-danger" onclick="removeSet(${exIdx}, ${setIdx})">✕</button></td>
                        </tr>
                    `;
                });

                exBlock.innerHTML = `
                    <div class="exercise-header">
                        <span>${ex.name}</span>
                        <button class="btn btn-sm btn-danger" onclick="removeExercise(${exIdx})">Smazat</button>
                    </div>
                    <table class="sets-table">
                        <thead>
                            <tr>
                                <th style="width:25%;">Série</th>
                                <th style="width:35%;">Váha (kg)</th>
                                <th style="width:30%;">Opakování</th>
                                <th style="width:10%;"></th>
                            </tr>
                        </thead>
                        <tbody>
                            ${setsHtml}
                        </tbody>
                    </table>
                    <button class="btn btn-sm" style="margin-top: 8px;" onclick="addSet(${exIdx})">+ Přidat sérii</button>
                `;
                container.appendChild(exBlock);
            });
        }

        function updateSet(exIdx, setIdx, field, value) {
            currentWorkout.exercises[exIdx].sets[setIdx][field] = value;
            triggerSetCompletion();
        }

        function addSet(exIdx) {
            triggerSetCompletion();
            const lastSet = currentWorkout.exercises[exIdx].sets.slice(-1)[0];
            const newWeight = lastSet ? lastSet.weight : "";
            const newReps = lastSet ? lastSet.reps : "";
            
            currentWorkout.exercises[exIdx].sets.push({ weight: newWeight, reps: newReps });
            renderWorkoutExercises();
        }

        function removeSet(exIdx, setIdx) {
            currentWorkout.exercises[exIdx].sets.splice(setIdx, 1);
            saveActiveWorkoutState();
            renderWorkoutExercises();
        }

        function removeExercise(exIdx) {
            currentWorkout.exercises.splice(exIdx, 1);
            saveActiveWorkoutState();
            renderWorkoutExercises();
        }

        function addExercisePrompt() {
            const name = prompt("Zadejte název nového cviku:");
            if (name && name.trim() !== "") {
                currentWorkout.exercises.push({
                    name: name.trim(),
                    sets: [{ weight: "", reps: "" }]
                });
                saveActiveWorkoutState();
                renderWorkoutExercises();
            }
        }

        function finishWorkout() {
            if (!confirm("Opravdu chcete ukončit a uložit trénink?")) return;

            triggerSetCompletion(); // Uloží poslední pauzu
            clearInterval(mainInterval);
            
            const now = new Date();
            currentWorkout.endTime = now.toISOString();

            const start = new Date(currentWorkout.startTime);
            const totalSec = Math.floor((now - start) / 1000);
            const restSec = currentWorkout.totalRestSeconds || 0;
            const netSec = Math.max(0, totalSec - restSec);

            currentWorkout.totalDurationText = formatDurationText(totalSec);
            currentWorkout.netDurationText = formatDurationText(netSec);
            currentWorkout.restDurationText = formatDurationText(restSec);

            const history = JSON.parse(localStorage.getItem("gym_history") || "[]");
            history.unshift(currentWorkout);
            localStorage.setItem("gym_history", JSON.stringify(history));

            currentWorkout = null;
            localStorage.removeItem("gym_active_workout");

            document.getElementById("workout-active").style.display = "none";
            document.getElementById("workout-setup").style.display = "block";
            document.getElementById("timer").innerText = "00:00:00";

            renderHistory();
            alert("Trénink byl uložen!");
        }

        function saveActiveWorkoutState() {
            if (currentWorkout) {
                localStorage.setItem("gym_active_workout", JSON.stringify(currentWorkout));
            }
        }

        function checkActiveWorkout() {
            const saved = localStorage.getItem("gym_active_workout");
            if (saved) {
                try {
                    currentWorkout = JSON.parse(saved);
                    uiStartWorkout();
                } catch(e) {
                    localStorage.removeItem("gym_active_workout");
                }
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem("gym_history") || "[]");
            const tbody = document.getElementById("history-tbody");
            tbody.innerHTML = "";

            if (history.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color: var(--text-muted);">Zatím nemáte žádné uložené tréninky.</td></tr>`;
                return;
            }

            history.forEach((w, idx) => {
                const startDate = new Date(w.startTime);
                const endDate = w.endTime ? new Date(w.endTime) : null;

                const startStr = startDate.toLocaleDateString("cs-CZ") + " " + startDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const endStr = endDate ? endDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : "-";

                let exercisesSummaryHtml = "";
                let totalSetsCount = 0;

                w.exercises.forEach(ex => {
                    const validSets = ex.sets.filter(s => s.weight !== "" || s.reps !== "");
                    if (validSets.length > 0) {
                        totalSetsCount += validSets.length;
                        const setsFormatted = validSets.map((s, i) => `<span class="set-chip">${i+1}. s: ${s.weight || 0}kg × ${s.reps || 0}</span>`).join(" ");
                        exercisesSummaryHtml += `<div style="margin-bottom: 6px;"><strong>${ex.name}:</strong><br>${setsFormatted}</div>`;
                    }
                });

                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td><strong>Začátek:</strong> ${startStr}<br><small style="color:var(--text-muted);">Konec: ${endStr}</small></td>
                    <td>
                        ⏱️ Celkem: <strong>${w.totalDurationText || '-'}</strong><br>
                        🏋️ Čistý čas: <strong style="color:var(--accent);">${w.netDurationText || '-'}</strong><br>
                        ☕ Pauzy: <small style="color:var(--warning);">${w.restDurationText || '0 min'}</small>
                    </td>
                    <td><strong>${w.type}</strong><br><small style="color:var(--text-muted);">${totalSetsCount} sérií</small></td>
                    <td>${exercisesSummaryHtml || '<em>Žádné zapsané série</em>'}</td>
                    <td>
                        <button class="btn btn-sm btn-danger" onclick="deleteHistoryItem(${idx})">Smazat</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function deleteHistoryItem(idx) {
            if (confirm("Opravdu chcete smazat tento záznam?")) {
                const history = JSON.parse(localStorage.getItem("gym_history") || "[]");
                history.splice(idx, 1);
                localStorage.setItem("gym_history", JSON.stringify(history));
                renderHistory();
            }
        }

        function exportData() {
            const history = localStorage.getItem("gym_history") || "[]";
            const blob = new Blob([history], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `gym_export_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }
    </script>
</body>
</html>
